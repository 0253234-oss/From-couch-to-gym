<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Couch to Gym — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2B24;
    --bg:#EEF1EA;
    --card:#FFFFFF;
    --sage:#7E9B7E;
    --deep:#33523F;
    --accent:#C75B39;
    --muted:#6B7A70;
    --line:#DDE3DB;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
  }
  h1,h2,h3,.display{font-family:'Sora','Inter',sans-serif}
  .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}

  .demobar{
    background:var(--ink);color:#E8EDE7;padding:10px 14px;
    display:flex;align-items:center;gap:8px;font-size:12px;
  }
  .demobar .tag{font-family:'Sora';font-weight:700;letter-spacing:.08em;font-size:10px;color:#A9C0A9}
  .chip{
    border:1px solid #4A5C50;border-radius:999px;padding:5px 10px;
    background:transparent;color:#CDD8CC;font-size:12px;font-family:'Inter';cursor:pointer;
  }
  .chip.on{background:#E8EDE7;color:var(--ink);border-color:#E8EDE7;font-weight:600}

  header{padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:center}
  header .brand{font-family:'Sora';font-weight:800;font-size:17px;letter-spacing:-.01em}
  header .brand span{color:var(--accent)}
  .iconbtn{
    border:1px solid var(--line);background:var(--card);border-radius:12px;
    width:40px;height:40px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  main{flex:1;padding:10px 20px 110px;display:flex;flex-direction:column;gap:14px}

  .dusk{
    border-radius:var(--radius);padding:20px;color:#FFF7F0;
    background:linear-gradient(115deg,var(--deep) 0%,#5A6B4D 45%,var(--accent) 100%);
    position:relative;overflow:hidden;
  }
  .dusk::after{
    content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    border-radius:50%;background:rgba(255,247,240,.14);
  }
  .dusk .hora{font-size:11px;letter-spacing:.14em;font-weight:600;text-transform:uppercase;opacity:.85}
  .dusk h2{font-size:22px;line-height:1.15;margin:6px 0 4px;font-weight:800}
  .dusk p{font-size:13.5px;opacity:.9;margin-bottom:14px}
  .dusk button{
    width:100%;border:none;border-radius:12px;padding:14px;
    font-family:'Sora';font-weight:700;font-size:15px;cursor:pointer;
    background:#FFF7F0;color:var(--deep);
  }

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h3{font-size:16px;font-weight:700;margin-bottom:4px}
  .card p{font-size:13.5px;color:var(--muted)}
  .row{display:flex;gap:12px}
  .row .card{flex:1;cursor:pointer;transition:transform .08s}
  .row .card:active{transform:scale(.97)}
  .emoji{font-size:26px;margin-bottom:8px;display:block}

  .btn{
    border:none;border-radius:12px;padding:15px;width:100%;
    font-family:'Sora';font-weight:700;font-size:15px;cursor:pointer;
  }
  .btn.primary{background:var(--accent);color:#FFF7F0}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn.deep{background:var(--deep);color:#F2F5EF}

  /* onboarding */
  .welcome{
    border-radius:var(--radius);padding:30px 22px;color:#F2F5EF;background:var(--deep);
    position:relative;overflow:hidden;
  }
  .welcome::after{
    content:"";position:absolute;left:-40px;bottom:-40px;width:160px;height:160px;
    border-radius:50%;background:rgba(242,245,239,.08);
  }
  .welcome h2{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:14px}
  .welcome h2 span{color:#E8A583}
  .guide{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .gitem{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
  .gitem b{display:block;font-family:'Sora';font-size:14px}
  .gitem small{opacity:.8;font-size:13px}
  .gitem .gi{font-size:20px}
  .welcome .btn{background:#FFF7F0;color:var(--deep)}

  .step-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .bigq{font-family:'Sora';font-size:24px;font-weight:800;line-height:1.15;margin:6px 0 6px}
  .hint{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .optgrid{display:flex;flex-direction:column;gap:10px}
  .opt{
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:16px;text-align:left;cursor:pointer;font-size:15px;font-family:'Inter';
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .opt small{color:var(--muted);text-align:right}
  .opt .lead{display:flex;gap:10px;align-items:center}
  input.name{
    width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--card);
    padding:16px;font-size:16px;font-family:'Inter';margin-bottom:12px;outline:none;
  }
  input.name:focus{border-color:var(--sage)}
  .dots{display:flex;gap:6px;margin-bottom:4px}
  .dots i{width:22px;height:4px;border-radius:99px;background:var(--line)}
  .dots i.on{background:var(--accent)}

  .work-hero{text-align:center;padding:26px 0 8px}
  .work-hero .timer{font-family:'Sora';font-size:58px;font-weight:800;letter-spacing:-.02em}
  .work-hero .exname{font-size:18px;font-weight:600;margin-top:4px}
  .work-hero .excue{font-size:13px;color:var(--muted);margin:8px 18px 0;line-height:1.45}
  .work-hero .exnext{font-size:13px;color:var(--muted);margin-top:4px}
  .exlist{display:flex;flex-direction:column;gap:8px}
  .exitem{
    display:flex;justify-content:space-between;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;
  }
  .exitem.done{opacity:.45;text-decoration:line-through}
  .exitem.now{border-color:var(--accent);font-weight:600}
  .exitem span:last-child{color:var(--muted)}

  .rest{
    text-align:center;padding:46px 20px;border-radius:var(--radius);
    background:var(--deep);color:#F2F5EF;
  }
  .rest .emoji{font-size:44px}
  .rest h2{font-size:24px;font-weight:800;margin:10px 0 6px}
  .rest p{font-size:14px;opacity:.85;max-width:280px;margin:0 auto 18px}

  .streak-big{font-family:'Sora';font-size:46px;font-weight:800}
  .weekdots{display:flex;justify-content:space-between;margin-top:14px}
  .dot{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .dot i{
    width:30px;height:30px;border-radius:50%;font-style:normal;
    display:flex;align-items:center;justify-content:center;font-size:14px;
    background:var(--bg);border:1.5px solid var(--line);
  }
  .dot i.hit{background:var(--sage);border-color:var(--sage);color:#fff}

  nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;background:var(--card);
    border-top:1px solid var(--line);display:flex;padding:10px 0 18px;
  }
  nav button{
    flex:1;border:none;background:none;font-family:'Inter';font-size:11px;
    color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;
  }
  nav button .ic{font-size:20px}
  nav button.on{color:var(--deep);font-weight:600}

  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#E8EDE7;padding:11px 18px;border-radius:999px;
    font-size:13px;z-index:60;display:none;
  }
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="phone">

  <div class="demobar" id="demobar" style="display:none">
    <span class="tag">DEMO</span>
    <button class="chip on" data-mode="weekday6" onclick="setMode('weekday6',this)">L–V · 6pm</button>
    <button class="chip" data-mode="weekday" onclick="setMode('weekday',this)">L–V · día</button>
    <button class="chip" data-mode="weekend" onclick="setMode('weekend',this)">Finde</button>
    <button class="chip" onclick="resetOnboarding()" style="margin-left:auto">↺ Reiniciar</button>
  </div>

  <header id="hdr" class="hidden">
    <div class="brand" onclick="tapLogo()">From Couch <span>to Gym</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="iconbtn" id="streakChip" style="width:auto;padding:0 12px;font-family:'Sora';font-weight:700;font-size:14px" onclick="go('profile')">🔥 4</button>
      <button class="iconbtn" onclick="go('profile')">👤</button>
    </div>
  </header>

  <main id="main"></main>

  <nav id="tabs" class="hidden">
    <button id="tab-home" class="on" onclick="go('home')"><span class="ic">🏠</span>Inicio</button>
    <button id="tab-profile" onclick="go('profile')"><span class="ic">🔥</span>Mi semana</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= STATE (solo en memoria) ================= */
let mode = 'weekday';
let manualMode = false;
let screen = 'welcome';
let profile = {name:'', barrier:null, time:null, equip:null, freq:3, reminder:'6:00 PM'};
let streak = 4;                 // racha de días activos (descansar no la rompe)
let sessionsThisWeek = 2;
let weekHits = [true,false,true,false,false,false,false];
let routine = [], exIdx = 0, secsLeft = 0, tick = null, routineTitle = '', currentKey = '';
let badges = [
 {icon:'🥇', name:'Primer paso', desc:'Tu primera sesión completada', got:false},
 {icon:'🔥', name:'Racha de 5', desc:'5 días activos seguidos', got:false},
 {icon:'📍', name:'Donde sea', desc:'Entrenaste fuera de casa', got:false},
 {icon:'🌿', name:'Descanso pro', desc:'Sesión ligera en fin de semana', got:false},
];
let lastUnlocked = null;

const BARRIERS = {
  time:  {icon:'⏰', label:'No tengo tiempo', sub:'mi agenda me come',
          routineKey:'quick', tip:{t:'Tu ventana de las 6pm', p:'Detectamos tu mejor momento: al salir del trabajo, antes de llegar a casa. Ahí vive tu rutina.'}},
  phone: {icon:'📱', label:'Me distraigo antes de empezar', sub:'agarro el cel y ya perdí',
          routineKey:'focus', tip:{t:'Modo enfoque', p:'Tu rutina arranca en un solo toque, antes de que cualquier otra app te gane la mañana.'}},
  unsure:{icon:'🤷‍♀️', label:'No sé qué ejercicios me convienen', sub:'no quiero lastimarme',
          routineKey:'lowimpact', tip:{t:'Guiado y seguro', p:'Rutinas de bajo impacto, paso a paso, pensadas para sentirte fuerte sin lastimarte.'}},
  couch: {icon:'🛋️', label:'Me cuesta arrancar', sub:'el primer paso es lo difícil',
          routineKey:'kickstart', tip:{t:'Solo 2 minutos para arrancar', p:'Tu rutina empieza con un arranque de 2 minutos para vencer la inercia — y sigue contigo hasta completar tu tiempo del día.'}},
};

const LIB = {
  quick: {title:'Rutina exprés', ex:[
    ['Jumping jacks suaves',45,'Abre y cierra brazos y piernas con saltos suaves'],
    ['Sentadillas',60,'Pies al ancho de hombros; baja como si te sentaras, espalda recta'],
    ['Lagartijas en pared',45,'Manos en la pared a la altura del pecho; acércate y empuja'],
    ['Zancadas alternadas',60,'Paso largo al frente; la rodilla de atrás baja sin tocar el piso'],
    ['Plancha',30,'Antebrazos al piso, cuerpo en línea recta, aprieta el abdomen'],
    ['Escaladores lentos',45,'En plancha, lleva una rodilla al pecho y alterna'],
    ['Puente de glúteo',60,'Boca arriba, rodillas dobladas; sube la cadera apretando glúteos'],
    ['Estiramiento final',60,'Respira profundo; estira piernas, espalda y brazos']]},
  focus: {title:'Modo enfoque · empieza ya', ex:[
    ['Sentadillas (¡sin pensarlo!)',45,'Empieza YA: pies al ancho de hombros y baja controlado'],
    ['Marcha rápida en el lugar',60,'Rodillas arriba, brazos activos, ritmo constante'],
    ['Lagartijas en pared',45,'Manos en la pared a la altura del pecho; acércate y empuja'],
    ['Plancha',30,'Antebrazos al piso, cuerpo en línea recta, abdomen apretado'],
    ['Zancadas alternadas',60,'Paso largo al frente; baja la rodilla de atrás sin tocar el piso'],
    ['Escaladores lentos',45,'En plancha, lleva una rodilla al pecho y alterna'],
    ['Estiramiento final',60,'Respira profundo y suelta el cuerpo']]},
  lowimpact: {title:'Bajo impacto · guiado y seguro', ex:[
    ['Marcha suave en el lugar',60,'Ritmo cómodo, sin saltar; brazos acompañan'],
    ['Sentadilla a silla (con apoyo)',60,'Baja hasta tocar la silla y sube; apóyate si lo necesitas'],
    ['Elevaciones de talón',45,'De pie, sube a las puntas de los pies lento y baja controlado'],
    ['Bird-dog (espalda protegida)',60,'En cuatro puntos, estira brazo y pierna contrarios sin arquear'],
    ['Puente de glúteo suave',60,'Boca arriba, sube la cadera solo hasta donde sea cómodo'],
    ['Movilidad de hombros',45,'Círculos lentos hacia atrás y adelante, sin forzar'],
    ['Estiramiento final',75,'Estira suave cada zona; nada debe doler']]},
  kickstart: {title:'Arranque de 2 minutos', ex:[
    ['Ponte de pie y estírate',30,'Solo levántate y estira los brazos al techo — ya empezaste'],
    ['Marcha en el lugar',45,'Camina sin moverte de lugar, ritmo cómodo'],
    ['5 sentadillas suaves',45,'Sin prisa: baja y sube 5 veces, espalda recta']]},
  mat: {title:'Entrena aquí · espacio de un tapete', ex:[
    ['Marcha en el lugar',60,'Camina sin moverte de lugar, rodillas arriba'],
    ['Sentadilla a silla',60,'Baja hasta casi tocar la silla y sube'],
    ['Plancha',30,'Antebrazos al piso, cuerpo en línea recta'],
    ['Elevaciones de talón',45,'Sube a las puntas de los pies y baja lento'],
    ['Bird-dog',60,'En cuatro puntos, brazo y pierna contrarios estirados'],
    ['Estiramiento de espalda',60,'Redondea y estira la espalda con calma']]},
  light: {title:'Sesión ligera opcional · 8 min', ex:[
    ['Caminata suave en el lugar',90,'Ritmo de paseo, hombros relajados'],
    ['Movilidad de cadera',60,'Círculos suaves de cadera hacia ambos lados'],
    ['Estiramiento de piernas',90,'Estira suave; mantén cada posición respirando'],
    ['Respiración y cierre',60,'Inhala 4 segundos, exhala 6; suelta el día']]},
};

/* Ejercicios CON equipo — se intercalan cuando la clienta eligió banda o mancuernas */
const EQUIP_EX = {
  'banda elástica': [
    ['Remo con banda',45,'CON BANDA: písala con ambos pies y jala los extremos hacia tu cintura, espalda recta'],
    ['Press de hombros con banda',45,'CON BANDA: písala, lleva los extremos a los hombros y empuja hacia arriba'],
    ['Sentadilla con banda',60,'CON BANDA: bajo los pies y extremos a los hombros; te frena al subir'],
    ['Apertura de pecho con banda',45,'CON BANDA: sujétala frente al pecho y ábrela sin doblar los codos']],
  'mancuernas': [
    ['Remo con mancuerna',45,'CON MANCUERNA: apoya una mano en una silla y sube la mancuerna hacia tu cadera'],
    ['Press de hombros con mancuernas',45,'CON MANCUERNAS: desde los hombros, empuja hacia arriba sin trabar codos'],
    ['Sentadilla goblet',60,'CON MANCUERNA: sujétala vertical pegada al pecho y baja controlado'],
    ['Curl de bíceps',45,'CON MANCUERNAS: codos pegados al cuerpo, sube y baja lento']],
};


/* ================= HORA REAL + DEMO OCULTO ================= */
const RH = {'7:00 AM':7,'1:00 PM':13,'6:00 PM':18,'8:00 PM':20};
function detectMode(){
  const d = new Date(), wd = d.getDay(), h = d.getHours();
  if(wd===0 || wd===6) return 'weekend';
  const rh = RH[profile.reminder] || 18;
  return (h>=rh && h<rh+3) ? 'weekday6' : 'weekday';
}
let tapCount=0, tapTimer=null;
function tapLogo(){
  tapCount++; clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>tapCount=0, 600);
  if(tapCount>=3){
    const d=document.getElementById('demobar');
    const show = d.style.display==='none';
    d.style.display = show ? 'flex' : 'none';
    if(!show){ manualMode=false; mode=detectMode(); render(); }
    tapCount=0;
  }
}

/* ================= NAV ================= */
function go(s){
  screen = s;
  if(!manualMode) mode = detectMode();
  const onboarding = ['welcome','obName','obBarrier','obFreq','obTime','obEquip'].includes(s);
  document.getElementById('hdr').classList.toggle('hidden', onboarding);
  document.getElementById('tabs').classList.toggle('hidden', onboarding);
  const th=document.getElementById('tab-home'), tp=document.getElementById('tab-profile');
  if(th){th.className = s==='home'?'on':''; tp.className = s==='profile'?'on':'';}
  stopTimer();
  render();
}
function setMode(m, el){
  mode = m; manualMode = true;
  document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(!['profile'].includes(screen) && profile.barrier) screen='home';
  stopTimer(); render();
}
function resetOnboarding(){
  profile = {name:'', barrier:null, time:null, equip:null};
  go('welcome');
}

/* ================= RENDER ================= */
function render(){
  const m = document.getElementById('main');
  if(screen==='welcome')   m.innerHTML = viewWelcome();
  if(screen==='obName')    m.innerHTML = viewObName();
  if(screen==='obBarrier') m.innerHTML = viewObBarrier();
  if(screen==='obFreq')    m.innerHTML = viewObFreq();
  if(screen==='obTime')    m.innerHTML = viewObTime();
  if(screen==='obEquip')   m.innerHTML = viewObEquip();
  if(screen==='home')      m.innerHTML = mode==='weekend' ? viewWeekend() : viewHome();
  if(screen==='workout')   m.innerHTML = viewWorkout();
  if(screen==='doneS')     m.innerHTML = viewDone();
  if(screen==='profile')   m.innerHTML = viewProfile();
  const inp=document.getElementById('nameInput');
  if(inp){inp.focus();}
}

function dots(n){
  return `<div class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
}

function viewWelcome(){
  return `
    <section class="welcome">
      <h2>Del sillón al gym, <span>sin dramas</span></h2>
      <div class="guide">
        <div class="gitem"><span class="gi">⏱️</span><div><b>Rutinas que caben en tu día</b><small>Desde 2 hasta 20 minutos, donde estés.</small></div></div>
        <div class="gitem"><span class="gi">🎯</span><div><b>Hecha a tu medida</b><small>Te hacemos 4 preguntas y la app se adapta a tu obstáculo, no al revés.</small></div></div>
        <div class="gitem"><span class="gi">🌿</span><div><b>Descansar también cuenta</b><small>Sin culpas, sin rachas rotas, sin castigos.</small></div></div>
      </div>
      <button class="btn" onclick="go('obName')">Personalizar mi app</button>
    </section>`;
}

function viewObName(){
  return `
    ${dots(1)}
    <div class="step-label">Conozcámonos · 1 de 5</div>
    <div class="bigq">¿Cómo te llamas?</div>
    <div class="hint">Para hablarte a ti, no a "usuario".</div>
    <input class="name" id="nameInput" type="text" placeholder="Tu nombre" maxlength="20"
      onkeydown="if(event.key==='Enter')saveName()">
    <button class="btn primary" onclick="saveName()">Continuar</button>`;
}
function saveName(){
  const v = document.getElementById('nameInput').value.trim();
  profile.name = v ? v.charAt(0).toUpperCase()+v.slice(1) : 'Hola';
  go('obBarrier');
}

function viewObBarrier(){
  const opts = Object.entries(BARRIERS).map(([k,b])=>`
    <button class="opt" onclick="pickBarrier('${k}')">
      <span class="lead"><span>${b.icon}</span> ${b.label}</span>
      <small>${b.sub}</small>
    </button>`).join('');
  return `
    ${dots(2)}
    <div class="step-label">Conozcámonos · 2 de 5</div>
    <div class="bigq">¿Qué es lo que más te detiene, ${profile.name}?</div>
    <div class="hint">Elige tu obstáculo principal — la app se arma alrededor de él.</div>
    <div class="optgrid">${opts}</div>`;
}
function pickBarrier(k){ profile.barrier=k; go('obFreq'); }

function viewObFreq(){
  return `
    ${dots(3)}
    <div class="step-label">Conozcámonos · 3 de 5</div>
    <div class="bigq">¿Cuántas veces a la semana quieres entrenar?</div>
    <div class="hint">Tu meta, a tu ritmo — siempre la puedes cambiar después.</div>
    <div class="optgrid">
      <button class="opt" onclick="pickFreq(2)">2 veces <small>empezar suave</small></button>
      <button class="opt" onclick="pickFreq(3)">3 veces <small>la meta clásica</small></button>
      <button class="opt" onclick="pickFreq(4)">4 veces <small>ya con ritmo</small></button>
      <button class="opt" onclick="pickFreq(5)">5 veces <small>entre semana completo</small></button>
    </div>`;
}
function pickFreq(f){ profile.freq=f; go('obTime'); }

function viewObTime(){
  return `
    ${dots(4)}
    <div class="step-label">Conozcámonos · 4 de 5</div>
    <div class="bigq">¿Cuánto tiempo real tienes en un día normal?</div>
    <div class="hint">Sé honesta — es mejor 10 minutos que sí pasan, que 40 que no.</div>
    <div class="optgrid">
      <button class="opt" onclick="pickTime(10)">10 minutos <small>lo mínimo cuenta</small></button>
      <button class="opt" onclick="pickTime(15)">15 minutos <small>el clásico</small></button>
      <button class="opt" onclick="pickTime(20)">20 minutos <small>día con margen</small></button>
      <button class="opt" onclick="pickTime(30)">30 minutos <small>sesión completa</small></button>
      <button class="opt" onclick="pickTime(60)">1 hora <small>los días que sí se puede</small></button>
    </div>`;
}
function pickTime(t){ profile.time=t; go('obEquip'); }

function viewObEquip(){
  return `
    ${dots(5)}
    <div class="step-label">Conozcámonos · 5 de 5</div>
    <div class="bigq">¿Con qué cuentas donde sueles estar?</div>
    <div class="hint">Sin equipo también hay rutina completa.</div>
    <div class="optgrid">
      <button class="opt" onclick="pickEquip('sin equipo')">Nada, solo yo <small>peso corporal</small></button>
      <button class="opt" onclick="pickEquip('banda elástica')">Banda elástica</button>
      <button class="opt" onclick="pickEquip('mancuernas')">Mancuernas</button>
    </div>`;
}
function pickEquip(e){
  profile.equip=e;
  toast(`Listo, ${profile.name} — tu app está personalizada`);
  go('home');
}

function viewHome(){
  const b = BARRIERS[profile.barrier] || BARRIERS.time;
  const d = buildDaily();
  const preview = d.ex.slice(0,3).map(e=>e[0]).join(' · ');
  const banner = mode==='weekday6' ? `
    <section class="dusk">
      <div class="hora">${profile.reminder} · Tu recordatorio</div>
      <h2>Es tu momento, ${profile.name}</h2>
      <p>${d.title} está lista: ${preview}… Un toque y empieza.</p>
      <button onclick="startDaily()">Empezar mi rutina de ${profile.time} min</button>
    </section>` : `
    <div class="card">
      <h3>Tu rutina de hoy, ${profile.name}</h3>
      <p>${d.title} · ${profile.equip}</p>
      <p style="margin-top:4px">${preview}…</p>
      <div style="height:12px"></div>
      <button class="btn primary" onclick="startDaily()">Comenzar</button>
    </div>`;
  return banner + `
    <div class="card">
      <h3>${b.icon} ${b.tip.t}</h3>
      <p>${b.tip.p}</p>
    </div>
    <div class="card">
      <h3>⏰ Tu recordatorio diario</h3>
      <p>Te avisamos a la hora que sí puedes — un toque y tu rutina arranca.</p>
      <div style="height:10px"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${['7:00 AM','1:00 PM','6:00 PM','8:00 PM'].map(h=>`
          <button class="chip" style="border-color:var(--line);color:${profile.reminder===h?'#fff':'var(--ink)'};background:${profile.reminder===h?'var(--deep)':'transparent'}"
            onclick="setReminder('${h}')">${h}</button>`).join('')}
      </div>
    </div>
    <div class="row">
      <div class="card" onclick="startRoutine('mat')">
        <span class="emoji">📍</span>
        <h3>Entrenar aquí</h3>
        <p>Solo necesitas el espacio de un tapete</p>
      </div>
      <div class="card" onclick="go('profile')">
        <span class="emoji">🔥</span>
        <h3>Racha: ${streak} días</h3>
        <p>${Math.min(sessionsThisWeek,profile.freq)}/${profile.freq} sesiones · meta semanal</p>
      </div>
    </div>`;
}

function viewWeekend(){
  return `
    <section class="rest">
      <span class="emoji">🌿</span>
      <h2>Es tu día de descanso</h2>
      <p>El fin de semana es tuyo, ${profile.name}. Descansar también es parte del plan — nada que cumplir hoy.</p>
      <button class="btn ghost" style="border-color:rgba(242,245,239,.4);color:#F2F5EF" onclick="startRoutine('light')">Sesión ligera (opcional)</button>
    </section>
    <div class="card">
      <h3>Nos vemos el lunes</h3>
      <p>Tu ventana de las 6pm te espera. Tu racha no se rompe por descansar.</p>
    </div>`;
}

function viewWorkout(){
  const cur = routine[exIdx];
  const next = routine[exIdx+1];
  const eqUser = EQUIP_EX[profile.equip];
  const tag = e => e[3] ? '🏋️ ' : (eqUser ? '🙌 ' : '');
  const list = routine.map((e,i)=>`
    <div class="exitem ${i<exIdx?'done':''} ${i===exIdx?'now':''}">
      <span>${tag(e)}${e[0]}</span><span>${e[1]}s</span>
    </div>`).join('');
  const legend = eqUser ? `<p style="font-size:12px;color:var(--muted);text-align:center">🏋️ = con ${profile.equip} · 🙌 = solo tu cuerpo</p>` : '';
  return `
    <div class="step-label">${routineTitle}</div>
    <div class="work-hero">
      <div class="timer" id="timer">${fmt(secsLeft)}</div>
      <div class="exname">${cur[0]}</div>
      ${cur[2]?`<div class="excue">${cur[2]}</div>`:''}
      <div class="exnext">${next?('Sigue: '+next[0]):'Último ejercicio'}</div>
    </div>
    <button class="btn deep" onclick="nextEx()">Siguiente ejercicio →</button>
    <button class="btn ghost" onclick="go('home')">Salir</button>
    ${legend}
    <div class="exlist">${list}</div>`;
}

function viewDone(){
  const badgeCard = lastUnlocked ? `
    <div class="card" style="text-align:center">
      <span class="emoji" style="font-size:36px">${lastUnlocked.icon}</span>
      <h3>¡Insignia desbloqueada!</h3>
      <p>${lastUnlocked.name} — ${lastUnlocked.desc}</p>
    </div>` : '';
  return `
    <section class="rest" style="background:var(--sage)">
      <span class="emoji" style="font-size:56px">🔥</span>
      <h2 style="font-size:34px">Racha de ${streak} días</h2>
      <p>¡Eso, ${profile.name}! ${sessionsThisWeek>=profile.freq?'Con esta cumpliste tu meta de '+profile.freq+' veces esta semana 🎯':'Vas '+sessionsThisWeek+' de '+profile.freq+' esta semana.'}</p>
      <button class="btn" style="background:#fff;color:var(--deep)" onclick="go('profile')">Ver mis recompensas</button>
    </section>
    ${badgeCard}`;
}

function viewProfile(){
  const days=['L','M','M','J','V','S','D'];
  const dd = days.map((d,i)=>`
    <div class="dot"><i class="${weekHits[i]?'hit':''}">${weekHits[i]?'✓':''}</i>${d}</div>`).join('');
  const bg = badges.map(b=>`
    <div style="text-align:center;opacity:${b.got?1:.32}">
      <div style="font-size:30px">${b.icon}</div>
      <div style="font-size:11px;font-weight:600;margin-top:4px">${b.name}</div>
    </div>`).join('');
  return `
    <div class="card" style="text-align:center;background:var(--deep);color:#F2F5EF;border:none">
      <div style="font-size:44px">🔥</div>
      <div class="streak-big" style="color:#F2F5EF">${streak} <span style="font-size:18px;font-weight:600;opacity:.75">días de racha</span></div>
      <p style="font-size:13px;opacity:.8;margin-top:4px">🧊 Protector de finde activo: descansar sábado y domingo no rompe tu racha.</p>
    </div>
    <div class="card">
      <div class="step-label">Esta semana · ${profile.name||''}</div>
      <div class="streak-big">${sessionsThisWeek}<span style="font-size:22px;font-weight:600;color:var(--muted)"> / ${profile.freq}</span> <span style="font-size:18px;font-weight:600;color:var(--muted)">sesiones</span></div>
      <p style="font-size:13px;color:${sessionsThisWeek>=profile.freq?'var(--deep)':'var(--muted)'};font-weight:${sessionsThisWeek>=profile.freq?'600':'400'}">${sessionsThisWeek>=profile.freq?'🎯 ¡Meta semanal cumplida!':'Tu meta: '+profile.freq+' veces por semana'}</p>
      <div class="weekdots">${dd}</div>
    </div>
    <div class="card">
      <h3>Mis insignias</h3>
      <div style="height:12px"></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${bg}</div>
    </div>
    <div class="card">
      <h3>Sin castigos</h3>
      <p>Los días sin entrenar no restan ni rompen nada. Aquí solo contamos lo que sí hiciste.</p>
    </div>`;
}

/* ================= WORKOUT ENGINE ================= */
const STYLE_TITLE = {
  quick:'Rutina exprés', focus:'Modo enfoque', lowimpact:'Bajo impacto · guiado',
  kickstart:'Arranque de 2 min + rutina suave'
};
function buildDaily(){
  const b = BARRIERS[profile.barrier] || BARRIERS.time;
  const target = (profile.time||15)*60;
  let ex=[], t=0, pool=LIB[b.routineKey].ex, title=STYLE_TITLE[b.routineKey]||'Tu rutina';
  if(profile.barrier==='couch'){
    LIB.kickstart.ex.forEach(e=>{ex.push([e[0],e[1],e[2],false]); t+=e[1];});
    pool = LIB.quick.ex;
  }
  const eq = EQUIP_EX[profile.equip] || null;
  let i=0, j=0, n=0;
  while(t < target){
    let src, isEq=false;
    if(eq && n%3===2){ src=eq[j%eq.length]; j++; isEq=true; }
    else{
      src = pool[i%pool.length];
      i++;
    }
    n++;
    const label = (!isEq && i>pool.length) ? `${src[0]} · ronda ${Math.ceil(i/pool.length)}` : src[0];
    ex.push([label, src[1], src[2], isEq]); t+=src[1];
  }
  const eqNote = eq ? ` · con ${profile.equip}` : '';
  return {title:`${title} · ${profile.time} min${eqNote}`, ex};
}
function startDaily(){
  const d = buildDaily();
  currentKey = 'daily';
  routine = d.ex; routineTitle = d.title; exIdx = 0; secsLeft = d.ex[0][1];
  screen='workout'; render(); runTimer();
}
function startRoutine(key){
  const r = LIB[key];
  currentKey = key;
  routine = r.ex; routineTitle = r.title; exIdx = 0; secsLeft = r.ex[0][1];
  screen='workout'; render(); runTimer();
}
function setReminder(h){
  profile.reminder = h;
  if(!manualMode) mode = detectMode();
  toast(`Recordatorio diario: ${h} ⏰`);
  render();
}
function runTimer(){
  stopTimer();
  tick = setInterval(()=>{
    secsLeft--;
    if(secsLeft<=0){ nextEx(); return; }
    const t=document.getElementById('timer'); if(t) t.textContent=fmt(secsLeft);
  },1000);
}
function nextEx(){
  exIdx++;
  if(exIdx>=routine.length){ finishSession(); return; }
  secsLeft = routine[exIdx][1]; render(); runTimer();
}
function finishSession(){
  stopTimer();
  sessionsThisWeek++;
  streak++;
  const day = mode==='weekend' ? 6 : 3;
  weekHits[day]=true;
  lastUnlocked = null;
  const unlock = b => { if(!b.got){ b.got=true; lastUnlocked=b; } };
  if(!badges[0].got) unlock(badges[0]);
  else if(streak>=5 && !badges[1].got) unlock(badges[1]);
  else if(currentKey==='mat' && !badges[2].got) unlock(badges[2]);
  else if(currentKey==='light' && !badges[3].got) unlock(badges[3]);
  const chip=document.getElementById('streakChip'); if(chip) chip.textContent=`🔥 ${streak}`;
  screen='doneS'; render();
}
function stopTimer(){ if(tick){clearInterval(tick); tick=null;} }
function fmt(s){ return `0:${String(s).padStart(2,'0')}`; }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',1800);
}

mode = detectMode();
go('welcome');
</script>
